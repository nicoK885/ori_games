<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAFAF8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>Betriebsrapport</title><style>html,body{margin:0;min-height:100%;display:grid;place-items:center;background:#FAFAF8;color:#111;font:700 13px system-ui;letter-spacing:.14em}p{opacity:.55}</style></head><body><p>RAPPORT WIRD GELADEN …</p><script>(async()=>{const files=['part-01.b64','part-02.b64','part-03.b64'];const data=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f);return r.text()})))).join('').replace(/\s/g,'');const bin=atob(data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<p>RAPPORT KONNTE NICHT GELADEN WERDEN.</p>';console.error(e)})</script></body></html>
