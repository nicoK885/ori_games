<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Game</title><style>html,body{margin:0;height:100%;background:#090b13;color:#eef;font:16px system-ui;display:grid;place-items:center}p{opacity:.7}</style></head><body><p>Spiel wird geladen …</p><script>(async()=>{const parts=[];for(let i=1;i<20;i++){const f=`part-${String(i).padStart(2,'0')}.b64`,r=await fetch(f);if(!r.ok){if(i===1)throw Error(f);break}parts.push(await r.text())}const data=parts.join('').replace(/\s/g,''),bin=atob(data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<p>Das Spiel konnte nicht geladen werden.</p>';console.error(e)})</script></body></html>
