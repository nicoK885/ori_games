<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen</title><style>html,body{margin:0;height:100%;background:#090b13;color:#eef;font:16px system-ui;display:grid;place-items:center}p{opacity:.7}</style></head><body><p>Spiel wird geladen …</p><script>(async()=>{const files=['part-01.b64','part-02.b64','part-03.b64'];const data=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f);return r.text()})))).join('').replace(/\s/g,'');const bin=atob(data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<p>Das Spiel konnte nicht geladen werden.</p>';console.error(e)})</script></body></html>
